[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelfile-lint"
version = "0.1.0"
description = "Local-first CLI linter for Ollama Modelfiles: parameter ranges, valid instructions, and readable formatting, with suggested fixes."
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]
keywords = ["ollama", "modelfile", "lint", "cli", "local-ai"]

[project.scripts]
modelfile-lint = "modelfile_lint.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
